name: Copilot review to batched issue

on:
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  upsert-review-issue:
    runs-on: ubuntu-latest
    if: >
      github.event.comment.user.type == 'Bot' &&
      contains(github.event.comment.user.login, 'copilot')
    steps:
      - name: Upsert batched Copilot review issue
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;
            const pr = context.payload.pull_request;

            if (!pr?.number) {
              core.info("No PR found; skipping.");
              return;
            }

            const prNumber = pr.number;
            const marker = `copilot-review-pr-${prNumber}`;
            const title = `Copilot review findings for PR #${prNumber}`;

            const finding = [
              `---`,
              ``,
              `## Finding from ${new Date().toISOString()}`,
              ``,
              `Comment: ${comment.html_url}`,
              ``,
              `### Original Copilot review text`,
              ``,
              comment.body
            ].join("\n");

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open ${marker} in:body`
            });

            if (existing.data.items.length > 0) {
              const issue = existing.data.items[0];

              const current = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${current.data.body}\n\n${finding}`
              });

              return;
            }

            const body = [
              `<!-- ${marker} -->`,
              ``,
              `## Source`,
              ``,
              `Copilot review findings from PR #${prNumber}`,
              ``,
              `PR: ${pr.html_url}`,
              ``,
              `## Acceptance Criteria`,
              ``,
              `- Triage each finding`,
              `- Convert valid findings into tests where practical`,
              `- Fix accepted findings`,
              `- Run lint, typecheck and tests`,
              `- Open a PR that links back to this issue`,
              ``,
              finding
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [
                "copilot-review",
                "must-fix-before-next-feature",
                "auto-generated"
              ]
            });
