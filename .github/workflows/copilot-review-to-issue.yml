name: Copilot review to batched issue

on:
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  upsert-review-issue:
    runs-on: ubuntu-latest
    if: >
      github.event.comment.user.type == 'Bot' &&
      contains(github.event.comment.user.login, 'copilot')
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;
            const pullRequest = context.payload.pull_request;
            const bodyText = comment.body ?? "";

            const isSummary =
              bodyText.includes("Pull request overview") ||
              bodyText.includes("Reviewed changes") ||
              bodyText.includes("generated no comments");

            const looksActionable =
              bodyText.includes("Medium") ||
              bodyText.includes("High") ||
              bodyText.includes("Suggested changeset") ||
              bodyText.includes("Suggested change") ||
              bodyText.includes("Consider") ||
              bodyText.includes("This implementation") ||
              bodyText.includes("This could") ||
              bodyText.includes("This may");

            if (isSummary || !looksActionable) {
              core.info("Skipping non-actionable Copilot output.");
              return;
            }

            const prNumber = pullRequest?.number;
            if (!prNumber) return;

            const marker = `copilot-review-pr-${prNumber}`;
            const title = `Copilot review findings for PR #${prNumber}`;

            const finding = [
              `---`,
              ``,
              `## Finding from ${new Date().toISOString()}`,
              ``,
              `Comment: ${comment.html_url}`,
              ``,
              `### Original Copilot review text`,
              ``,
              bodyText
            ].join("\n");

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:body ${marker}`
            });

            if (existing.data.items.length > 0) {
              const target = existing.data.items[0];

              const current = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: target.number
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: target.number,
                body: `${current.data.body}\n\n${finding}`
              });

              return;
            }

            const issueBody = [
              `<!-- ${marker} -->`,
              ``,
              `## Source`,
              ``,
              `Copilot review findings from PR #${prNumber}`,
              ``,
              `PR: ${pullRequest.html_url}`,
              ``,
              `## Acceptance Criteria`,
              ``,
              `- Triage each finding`,
              `- Convert valid findings into tests where practical`,
              `- Fix accepted findings`,
              `- Run lint, typecheck and tests`,
              `- Open a PR that links back to this issue`,
              ``,
              finding
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: issueBody,
              labels: [
                "copilot-review",
                "must-fix-before-next-feature",
                "auto-generated"
              ]
            });